name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: drss_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
   - name: Build and Test
        run: ./mvnw clean verify "-Dspring.profiles.active=it" "-DDB_URL=jdbc:mysql://127.0.0.1:3306/drss_db" "-DDB_USERNAME=root" "-DDB_PASSWORD=123456"