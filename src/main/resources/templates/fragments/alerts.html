<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Fragment hiển thị thông báo -->
<div th:fragment="flash-messages" class="flash-stack" aria-live="polite" aria-atomic="true">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="status">
        <span class="alert-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m7 12.5 3.2 3.2L17.5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg></span>
        <div class="alert-content" th:text="${successMsg}">Thành công!</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng thông báo"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span class="alert-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M10.3 4.9 2.9 18a1.8 1.8 0 0 0 1.6 2.7h15a1.8 1.8 0 0 0 1.6-2.7L13.7 4.9a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v4.5m0 3h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <div class="alert-content" th:text="${errorMsg}">Lỗi!</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng thông báo"></button>
    </div>
</div>
</html>
