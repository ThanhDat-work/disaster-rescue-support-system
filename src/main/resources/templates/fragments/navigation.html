<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top mb-5">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">DRSS - Cứu Nạn</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <!-- Menu cho Người dân -->
                <li class="nav-item" sec:authorize="hasRole('CITIZEN')">
                    <a class="nav-link" href="/requests/new">Gửi yêu cầu khẩn cấp</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CITIZEN')">
                    <a class="nav-link" href="/requests/my-requests">Yêu cầu của tôi</a>
                </li>

                <!-- Menu cho Điều phối viên -->
                <li class="nav-item" sec:authorize="hasRole('COORDINATOR')">
                    <a class="nav-link" href="/coordinator/pending">Danh sách chờ xác minh</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('COORDINATOR')">
                    <a class="nav-link" href="/coordinator/tracking">Theo dõi tiến độ</a>
                </li>

                <!-- Menu cho Đội cứu hộ -->
                <li class="nav-item" sec:authorize="hasRole('RESCUE_TEAM')">
                    <a class="nav-link" href="/team/tasks">Nhiệm vụ được giao</a>
                </li>

                <!-- Menu cho Quản trị viên -->
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Quản trị hệ thống</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/disasters">Quản lý loại thiên tai</a></li>
                        <li><a class="dropdown-item" href="/admin/users">Quản lý người dùng</a></li>
                        <li><a class="dropdown-item" href="/admin/teams">Quản lý đội cứu hộ</a></li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/profile">Hồ sơ cá nhân</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-outline-light btn-sm mt-1" type="submit">Đăng xuất</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login">Đăng nhập</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</html>
