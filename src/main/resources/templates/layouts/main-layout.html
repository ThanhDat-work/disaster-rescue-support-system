<!DOCTYPE html>
<html th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | DRSS'">DRSS - Hỗ trợ cứu nạn</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style Tokens -->
    <link rel="stylesheet" th:href="@{/css/style-tokens.css}">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navigation :: navbar}"></div>

    <div class="container pb-5">
        <!-- Flash Messages -->
        <div th:replace="~{fragments/alerts :: flash-messages}"></div>
        
        <!-- Nội dung chính của từng trang sẽ được nhúng vào đây -->
        <div th:replace="${content}"></div>
    </div>

    <!-- Bootstrap 5 JS Bundle & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
