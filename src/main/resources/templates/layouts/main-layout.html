<!doctype html>
<html
  th:fragment="layout(title, content)"
  xmlns:th="http://www.thymeleaf.org"
  lang="vi"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title th:text="${title} + ' | DRSS'">DRSS - Hỗ trợ cứu nạn</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- Custom Style Tokens -->
    <link rel="stylesheet" th:href="@{/css/style-tokens.css(v=2026102303)}" />
    <link rel="stylesheet" th:href="@{/css/custom.css(v=2026102502)}" />
    <link rel="stylesheet" th:href="@{/css/async-retry.css(v=2026102503)}" />
  </head>
  <body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navigation :: navbar}"></div>

    <main class="container app-container pb-5">
      <!-- Flash Messages -->
      <div th:replace="~{fragments/alerts :: flash-messages}"></div>

      <!-- Nội dung chính của từng trang sẽ được nhúng vào đây -->
      <div th:replace="${content}"></div>
    </main>

    <!-- Bootstrap 5 JS Bundle & Custom JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script th:src="@{/js/async-retry.js(v=2026102503)}"></script>
    <script th:src="@{/js/main.js(v=2026102502)}"></script>
  </body>
</html>
