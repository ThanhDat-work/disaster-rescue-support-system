<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout('Yêu cầu của tôi', ~{::section})}">
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"><div><p class="text-uppercase small fw-bold text-danger mb-1">Theo dõi cứu nạn</p><h1 class="h2 mb-1">Yêu cầu của tôi</h1><p class="text-secondary mb-0">Xem trạng thái và cập nhật mới nhất của các yêu cầu.</p></div><a class="btn btn-primary" th:href="@{/requests/new}">+ Gửi yêu cầu</a></div>
    <nav th:replace="~{fragments/components :: pagination(${pageData}, ${pageUrl}, ${pageQuery})}"></nav>
    <div class="card shadow-sm" th:if="${!pageData.empty}"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Mã yêu cầu</th><th>Loại thiên tai</th><th>Mức độ khẩn cấp</th><th>Địa điểm</th><th>Trạng thái</th><th>Ngày gửi</th><th></th></tr></thead><tbody><tr th:each="request : ${pageData.content}"><td class="fw-semibold" th:text="${request.displayCode}"></td><td th:text="${request.disasterType.disasterName}"></td><td th:text="${request.urgency}"></td><td th:text="${request.address}"></td><td><span th:replace="~{fragments/components :: status-badge(${request.status})}"></span></td><td th:text="${#temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/requests/{id}(id=${request.id})}">Chi tiết</a></td></tr></tbody></table></div></div>
    <div class="card text-center py-5" th:if="${pageData.empty}"><div class="card-body"><h2 class="h5">Bạn chưa gửi yêu cầu nào</h2><p class="text-secondary">Gửi yêu cầu cứu nạn để theo dõi tiến độ tại đây.</p><a class="btn btn-primary" th:href="@{/requests/new}">Tạo yêu cầu đầu tiên</a></div></div>
    <nav class="mt-3" th:replace="~{fragments/components :: pagination(${pageData}, ${pageUrl}, ${pageQuery})}"></nav>
</section>
</html>
