<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/main-layout :: layout(~{::title}, ~{::section})}"
>
  <head>
    <title th:text="${editing ? 'Sửa loại thiên tai | DRSS' : 'Thêm loại thiên tai | DRSS'}"></title>
  </head>
  <body>
    <section class="py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <a class="text-decoration-none" th:href="@{/admin/disasters}">← Quay lại danh sách</a>
          <div class="card card-body mt-3">
            <h1 class="h3" th:text="${editing ? 'Sửa loại thiên tai' : 'Thêm loại thiên tai'}"></h1>
            <form method="post" th:object="${form}" th:action="${editing ? '/admin/disasters/' + disasterId : '/admin/disasters'}" novalidate>
              <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="code">Mã loại thiên tai</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" id="code" th:field="*{code}" maxlength="20" required th:readonly="${editing}" />
                <div class="invalid-feedback" th:errors="*{code}"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="name">Tên loại thiên tai</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" th:field="*{name}" maxlength="100" required />
                <div class="invalid-feedback" th:errors="*{name}"></div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="description">Mô tả</label>
                <textarea class="form-control" id="description" rows="5" th:field="*{description}"></textarea>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" type="submit" th:text="${editing ? 'Lưu thay đổi' : 'Tạo loại thiên tai'}"></button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/disasters}">Hủy</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
