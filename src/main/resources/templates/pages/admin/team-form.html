<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout(~{::title}, ~{::section})}">
<head>
  <title th:text="${editing ? 'Sửa đội cứu hộ | DRSS' : 'Thêm đội cứu hộ | DRSS'}"></title>
</head>
<body>
<section class="py-4">
  <a class="text-decoration-none" th:href="@{/admin/teams}">← Quay lại danh sách</a>
  <form class="card card-body mt-3" method="post" th:object="${form}"
        th:action="${editing ? '/admin/teams/' + teamId : '/admin/teams'}" novalidate>
    <h1 class="h3" th:text="${editing ? 'Sửa đội cứu hộ' : 'Thêm đội cứu hộ'}"></h1>
    <p class="text-secondary">Chỉ user ACTIVE có ROLE_RESCUER mới được chọn. Xác nhận lựa chọn trước khi lưu đội.</p>
    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
      <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label" for="code">Mã đội</label>
        <input class="form-control" id="code" th:field="*{code}" maxlength="20" required />
        <div class="text-danger small" th:errors="*{code}"></div>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="name">Tên đội</label>
        <input class="form-control" id="name" th:field="*{name}" maxlength="100" required />
        <div class="text-danger small" th:errors="*{name}"></div>
      </div>

      <div class="col-12 col-xl-6">
        <div class="border rounded p-3 h-100">
          <h2 class="h5">Đội trưởng</h2>
          <label class="form-label" for="leader-search">Tìm theo tên, mã hoặc email</label>
          <input class="form-control mb-2" id="leader-search" type="search" placeholder="Nhập từ khóa" />
          <select class="form-select" id="leaderUserId" th:field="*{leaderUserId}" size="7">
            <option value="">-- Chọn đội trưởng --</option>
            <option th:each="candidate : ${rescuers}"
                    th:value="${candidate.id}"
                    th:text="|${candidate.fullName} · ${candidate.displayCode} · ${candidate.email}|"
                    th:attr="data-search=|${candidate.fullName} ${candidate.displayCode} ${candidate.email}|">
            </option>
          </select>
          <div class="text-danger small" th:errors="*{leaderUserId}"></div>
          <button class="btn btn-outline-primary btn-sm mt-2" id="confirm-leader" type="button">Xác nhận đội trưởng</button>
          <div class="small text-secondary mt-2" id="leader-summary">Chưa xác nhận đội trưởng.</div>
        </div>
      </div>

      <div class="col-12 col-xl-6">
        <div class="border rounded p-3 h-100">
          <h2 class="h5">Thành viên</h2>
          <label class="form-label" for="member-search">Tìm theo tên, mã hoặc email</label>
          <input class="form-control mb-2" id="member-search" type="search" placeholder="Nhập từ khóa" />
          <div class="border rounded p-2 overflow-auto" style="max-height: 15rem" id="member-options">
            <label class="form-check py-1 member-option" th:each="candidate : ${rescuers}"
                   th:attr="data-user-id=${candidate.id},data-search=|${candidate.fullName} ${candidate.displayCode} ${candidate.email}|">
              <input class="form-check-input" type="checkbox" th:field="*{memberUserIds}" th:value="${candidate.id}" />
              <span class="form-check-label" th:text="|${candidate.fullName} · ${candidate.displayCode} · ${candidate.email}|"></span>
            </label>
          </div>
          <div class="text-danger small" th:errors="*{memberUserIds}"></div>
          <button class="btn btn-outline-primary btn-sm mt-2" id="confirm-members" type="button">Xác nhận thành viên</button>
          <div class="small text-secondary mt-2" id="member-summary">Chưa chọn thành viên.</div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="contactNumber">Số điện thoại đội</label>
        <input class="form-control" id="contactNumber" th:field="*{contactNumber}" inputmode="numeric" maxlength="15" required />
        <div class="text-danger small" th:errors="*{contactNumber}"></div>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="status">Trạng thái</label>
        <select class="form-select" id="status" th:field="*{status}" required>
          <option th:each="option : ${teamStatuses}" th:value="${option}" th:text="${option}"></option>
        </select>
        <div class="text-danger small" th:errors="*{status}"></div>
      </div>
    </div>

    <div class="alert alert-warning mt-3 mb-0" th:if="${#lists.isEmpty(rescuers)}">
      Chưa có tài khoản ACTIVE mang ROLE_RESCUER. Hãy cấp quyền trước khi tạo đội.
    </div>
    <div class="d-flex flex-wrap gap-2 mt-4">
      <button class="btn btn-primary" type="submit" th:text="${editing ? 'Lưu thay đổi' : 'Tạo đội cứu hộ'}"></button>
      <a class="btn btn-outline-secondary" th:href="@{/admin/teams}">Hủy</a>
    </div>
  </form>
  <script th:src="@{/js/team-membership-picker.js}" defer></script>
</section>
</body>
</html>
