<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/main-layout :: layout(~{::title}, ~{::section})}"
>
  <head>
    <title>Quản lý người dùng | DRSS</title>
  </head>
  <body>
    <section class="py-4">
      <div class="mb-4">
        <p class="text-uppercase text-primary fw-semibold mb-1">Quản trị</p>
        <h1 class="h3 mb-1">Người dùng và vai trò</h1>
        <p class="text-secondary mb-0">
          Quản lý trạng thái tài khoản và quyền truy cập hiện tại.
        </p>
      </div>

      <div
        class="alert alert-danger"
        th:if="${errorMessage}"
        th:text="${errorMessage}"
      ></div>

      <form class="card card-body mb-4" method="get" th:action="@{/admin/users}">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-lg-4">
            <label class="form-label" for="keyword">Tìm kiếm</label>
            <input
              class="form-control"
              id="keyword"
              name="keyword"
              maxlength="100"
              placeholder="Mã, họ tên, email hoặc điện thoại"
              th:value="${keyword}"
            />
          </div>
          <div class="col-12 col-sm-6 col-lg-2">
            <label class="form-label" for="status">Trạng thái</label>
            <select class="form-select" id="status" name="status">
              <option value="">Tất cả</option>
              <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">ACTIVE</option>
              <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">INACTIVE</option>
              <option value="BANNED" th:selected="${status == 'BANNED'}">BANNED</option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-lg-2">
            <label class="form-label" for="role">Vai trò</label>
            <select class="form-select" id="role" name="role">
              <option value="">Tất cả</option>
              <option
                th:each="option : ${allowedRoles}"
                th:value="${option}"
                th:text="${option}"
                th:selected="${role == option}"
              ></option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-lg-2">
            <label class="form-label" for="size">Số dòng</label>
            <select class="form-select" id="size" name="size">
              <option
                th:each="option : ${pageSizes}"
                th:value="${option}"
                th:text="${option}"
                th:selected="${size == option}"
              ></option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-lg-2 d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" type="submit">Lọc</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Xóa lọc</a>
          </div>
        </div>
      </form>

      <div class="card" th:if="${!result.empty}">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Mã</th>
                <th>Họ tên</th>
                <th>Liên hệ</th>
                <th>Trạng thái</th>
                <th>Vai trò</th>
                <th class="text-end">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${result.content}">
                <td class="fw-semibold" th:text="${item.displayCode}"></td>
                <td th:text="${item.fullName}"></td>
                <td>
                  <div th:text="${item.email}"></div>
                  <small class="text-secondary" th:text="${item.phoneNumber}"></small>
                </td>
                <td>
                  <span
                    class="badge"
                    th:classappend="${item.status == 'ACTIVE'} ? 'text-bg-success' : (${item.status == 'INACTIVE'} ? 'text-bg-warning' : 'text-bg-danger')"
                    th:text="${item.status}"
                  ></span>
                </td>
                <td>
                  <div class="d-flex flex-wrap gap-1">
                    <span
                      class="badge text-bg-secondary"
                      th:each="assignedRole : ${item.roles}"
                      th:text="${assignedRole}"
                    ></span>
                    <span class="text-secondary" th:if="${item.roles.empty}">Không có vai trò</span>
                  </div>
                </td>
                <td class="text-end">
                  <a
                    class="btn btn-sm btn-outline-primary"
                    th:href="@{/admin/users/{id}(id=${item.id})}"
                  >Chi tiết</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card card-body text-center py-5" th:if="${result.empty}">
        <h2 class="h5">Không có người dùng phù hợp</h2>
        <p class="text-secondary mb-0">Hãy thay đổi từ khóa hoặc bộ lọc.</p>
      </div>

      <nav class="mt-4" aria-label="Phân trang" th:if="${result.totalPages > 1}">
        <ul class="pagination flex-wrap">
          <li class="page-item" th:classappend="${result.first} ? 'disabled'">
            <a
              class="page-link"
              th:href="@{/admin/users(keyword=${keyword},status=${status},role=${role},page=${result.number - 1},size=${size})}"
            >Trước</a>
          </li>
          <li class="page-item disabled">
            <span
              class="page-link"
              th:text="|Trang ${result.number + 1}/${result.totalPages}|"
            ></span>
          </li>
          <li class="page-item" th:classappend="${result.last} ? 'disabled'">
            <a
              class="page-link"
              th:href="@{/admin/users(keyword=${keyword},status=${status},role=${role},page=${result.number + 1},size=${size})}"
            >Sau</a>
          </li>
        </ul>
      </nav>
    </section>
  </body>
</html>
