<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout(~{::title}, ~{::section})}">
<head><title>Chi tiết đội của tôi | DRSS</title></head>
<body><section class="py-4 team-detail-page" th:attr="data-realtime-team-id=${team.id}">
  <a class="back-link" th:href="@{/team/my-teams}">← Đội của tôi</a>
  <div class="team-detail-heading"><div><p class="home-kicker">Đội cứu hộ</p><h1 th:text="${team.teamName}"></h1><p class="team-code" th:text="|${team.displayCode} · ${team.status}|"></p></div><span class="team-role" th:text="|Vai trò của bạn: ${team.currentUserRole}|"></span></div>
  <div class="member-section-heading"><div><h2>Thành viên trong đội</h2><p>Thông tin phục vụ phối hợp trong phạm vi đội.</p></div><span th:text="|${#lists.size(team.members)} thành viên|"></span></div>
  <div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Thành viên</th><th>Mã người dùng</th><th>Chức vụ</th></tr></thead><tbody><tr th:each="member : ${team.members}"><td><div class="member-identity"><span class="avatar-wrap"><img data-avatar-fallback th:if="${member.avatarSecureUrl != null}" th:src="${member.avatarSecureUrl}" alt=""/><span data-avatar-initial th:classappend="${member.avatarSecureUrl != null} ? ' d-none'" th:text="${#strings.substring(member.fullName,0,1)}">A</span></span><span th:text="${member.fullName}"></span></div></td><td th:text="${member.displayCode}"></td><td><span class="member-role" th:text="${member.teamRole}"></span></td></tr><tr th:if="${#lists.isEmpty(team.members)}"><td colspan="3" class="table-empty">Chưa có thành viên nào trong đội.</td></tr></tbody></table></div></div>
  <p class="privacy-note">Trang này không hiển thị email, số điện thoại hoặc liên kết hồ sơ của thành viên khác.</p>
</section></body></html>
