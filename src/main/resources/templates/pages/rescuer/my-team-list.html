<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout(~{::title}, ~{::section})}">
<head><title>Đội của tôi | DRSS</title></head>
<body><section class="py-4 rescuer-teams-page">
  <div class="page-heading mb-4"><p class="home-kicker">Cứu hộ</p><h1>Đội của tôi</h1><p>Các đội bạn đang tham gia và vai trò của mình.</p></div>
  <div class="team-list" th:if="${!#lists.isEmpty(teams)}">
    <article class="rescuer-team-row" th:each="team : ${teams}" th:attr="data-realtime-team-id=${team.id}">
      <div class="team-mark" aria-hidden="true">＋</div>
      <div class="team-main"><h2 th:text="${team.teamName}"></h2><p><span th:text="${team.displayCode}"></span><span class="team-dot">·</span><span th:text="|${team.memberCount} thành viên|"></span></p></div>
      <div class="team-context"><span class="team-role" th:text="${team.currentUserRole}"></span><span class="team-status" th:text="${team.status}"></span></div>
      <a class="btn btn-outline-primary" th:href="@{/team/my-teams/{id}(id=${team.id})}">Xem đội <span aria-hidden="true">→</span></a>
    </article>
  </div>
  <div class="empty-panel" th:if="${#lists.isEmpty(teams)}"><span class="empty-mark" aria-hidden="true">＋</span><h2>Bạn chưa thuộc đội cứu hộ nào</h2><p>Liên hệ quản trị viên để được thêm vào một đội.</p></div>
</section></body></html>
