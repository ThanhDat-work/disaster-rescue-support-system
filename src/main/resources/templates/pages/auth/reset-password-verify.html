<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/main-layout :: layout('Xác minh OTP', ~{::section})}"
>
  <section class="auth-page">
    <div class="auth-card auth-card-compact">
      <header class="auth-header">
        <span class="auth-step">Đặt lại mật khẩu · Bước 2/3</span>
        <h1>Xác minh OTP</h1>
        <p>
          Mã đã được gửi tới
          <strong th:text="${maskedEmail}">e***@example.com</strong>.
        </p>
      </header>
      <form
        th:action="@{/auth/reset-password/verify}"
        th:object="${resetOtpRequest}"
        method="post"
        class="needs-validation auth-form"
      >
        <input type="hidden" name="purpose" value="PASSWORD_RESET" />
        <div
          class="auth-form-error"
          th:if="${#fields.hasGlobalErrors()}"
          th:each="error : ${#fields.globalErrors()}"
          th:text="${error}"
        >
          OTP không hợp lệ.
        </div>
        <div>
          <label class="form-label" for="otp">Mã OTP</label>
          <input
            class="form-control auth-otp"
            th:classappend="${#fields.hasErrors('otp')} ? ' is-invalid'"
            id="otp"
            th:field="*{otp}"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            required
            autofocus
          />
          <div class="invalid-feedback" th:errors="*{otp}">
            OTP không hợp lệ.
          </div>
        </div>
        <div class="auth-actions">
          <button class="btn btn-primary" type="submit">Xác minh</button>
          <button
            class="btn btn-outline-secondary"
            type="submit"
            formnovalidate
            th:formaction="@{/auth/resend-otp}"
          >
            Gửi lại OTP
          </button>
        </div>
      </form>
      <p class="auth-switch">
        <a th:href="@{/auth/forgot-password}">Dùng email khác</a>
      </p>
    </div>
  </section>
</html>
