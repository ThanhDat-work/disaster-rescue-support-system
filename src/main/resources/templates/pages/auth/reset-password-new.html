<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/main-layout :: layout('Mật khẩu mới', ~{::section})}"
>
  <section class="auth-page">
    <div class="auth-card auth-card-compact">
      <header class="auth-header">
        <span class="auth-step">Đặt lại mật khẩu · Bước 3/3</span>
        <h1>Tạo mật khẩu mới</h1>
        <p>
          Không cần nhập lại email hoặc OTP. Quyền đặt lại chỉ có hiệu lực trong
          10 phút.
        </p>
      </header>
      <form
        th:action="@{/auth/reset-password/new}"
        th:object="${newPasswordRequest}"
        method="post"
        class="needs-validation auth-form"
      >
        <div
          class="auth-form-error"
          th:if="${#fields.hasGlobalErrors()}"
          th:each="error : ${#fields.globalErrors()}"
          th:text="${error}"
        >
          Không thể cập nhật.
        </div>
        <div>
          <label class="form-label" for="newPassword">Mật khẩu mới</label>
          <input
            class="form-control"
            th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid'"
            id="newPassword"
            type="password"
            th:field="*{newPassword}"
            minlength="12"
            maxlength="64"
            autocomplete="new-password"
            required
          />
          <div class="invalid-feedback" th:errors="*{newPassword}">
            Mật khẩu không hợp lệ.
          </div>
        </div>
        <div>
          <label class="form-label" for="confirmPassword"
            >Xác nhận mật khẩu</label
          >
          <input
            class="form-control"
            th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'"
            id="confirmPassword"
            type="password"
            th:field="*{confirmPassword}"
            minlength="12"
            maxlength="64"
            autocomplete="new-password"
            required
          />
          <div class="invalid-feedback" th:errors="*{confirmPassword}">
            Mật khẩu xác nhận không khớp.
          </div>
        </div>
        <div
          class="invalid-feedback d-block"
          th:if="${#fields.hasErrors('passwordConfirmed')}"
          th:errors="*{passwordConfirmed}"
        >
          Mật khẩu xác nhận không khớp.
        </div>
        <p class="field-hint">
          Mật khẩu dài 12–64 ký tự, có ít nhất một chữ cái và một chữ số.
        </p>
        <button class="btn btn-primary auth-submit" type="submit">
          Cập nhật mật khẩu
        </button>
      </form>
    </div>
  </section>
</html>
