<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/main-layout :: layout('Quên mật khẩu', ~{::section})}"
>
  <section class="auth-page">
    <div class="auth-card auth-card-compact">
      <header class="auth-header">
        <span class="auth-step">Đặt lại mật khẩu · Bước 1/3</span>
        <h1>Nhập email</h1>
        <p>Nếu email hợp lệ, hệ thống sẽ gửi một mã OTP đặt lại mật khẩu.</p>
      </header>
      <form
        th:action="@{/auth/forgot-password}"
        th:object="${forgotPasswordRequest}"
        method="post"
        class="needs-validation auth-form"
      >
        <div
          class="auth-form-error"
          th:if="${#fields.hasGlobalErrors()}"
          th:each="error : ${#fields.globalErrors()}"
          th:text="${error}"
        >
          Không thể tiếp tục.
        </div>
        <div>
          <label class="form-label" for="email">Email</label>
          <input
            class="form-control"
            th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
            id="email"
            type="email"
            th:field="*{email}"
            maxlength="150"
            autocomplete="email"
            required
            autofocus
          />
          <div class="invalid-feedback" th:errors="*{email}">
            Email không hợp lệ.
          </div>
        </div>
        <button class="btn btn-primary auth-submit" type="submit">
          Gửi mã đặt lại
        </button>
      </form>
      <p class="auth-switch">
        <a th:href="@{/auth/login}">Quay lại đăng nhập</a>
      </p>
    </div>
  </section>
</html>
