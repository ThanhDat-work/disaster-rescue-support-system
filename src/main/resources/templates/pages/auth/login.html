<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/main-layout :: layout('Đăng nhập', ~{::section})}"
>
  <section class="auth-page">
    <div class="auth-card auth-card-compact">
      <header class="auth-header">
        <span class="auth-step">DRSS · Đăng nhập</span>
        <h1>Chào mừng trở lại</h1>
        <p>Đăng nhập để tiếp tục sử dụng hệ thống hỗ trợ cứu nạn.</p>
      </header>
      <form
        th:action="@{/auth/login}"
        th:object="${loginRequest}"
        method="post"
        class="needs-validation auth-form"
      >
        <div
          class="auth-form-error"
          th:if="${#fields.hasGlobalErrors()}"
          th:each="error : ${#fields.globalErrors()}"
          th:text="${error}"
        >
          Đăng nhập thất bại.
        </div>
        <div>
          <label class="form-label" for="email">Email</label>
          <input
            class="form-control"
            th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
            id="email"
            type="email"
            th:field="*{email}"
            maxlength="150"
            autocomplete="email"
            required
            autofocus
          />
          <div class="invalid-feedback" th:errors="*{email}">
            Email không hợp lệ.
          </div>
        </div>
        <div>
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label" for="password">Mật khẩu</label>
            <a class="auth-link-small" th:href="@{/auth/forgot-password}"
              >Quên mật khẩu?</a
            >
          </div>
          <input
            class="form-control"
            th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
            id="password"
            type="password"
            th:field="*{password}"
            maxlength="64"
            autocomplete="current-password"
            required
          />
          <div class="invalid-feedback" th:errors="*{password}">
            Vui lòng nhập mật khẩu.
          </div>
        </div>
        <button class="btn btn-primary auth-submit" type="submit">
          Đăng nhập
        </button>
      </form>
      <div class="auth-secondary-actions">
        <a th:href="@{/auth/verify-otp}">Kích hoạt tài khoản</a>
        <span aria-hidden="true">·</span>
        <a th:href="@{/auth/register}">Tạo tài khoản mới</a>
      </div>
    </div>
  </section>
</html>
