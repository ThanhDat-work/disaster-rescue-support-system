spring:
  application:
    name: drss

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # CHUẨN YÊU CẦU: Chỉ validate, không tự động tạo bảng
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB
      file-size-threshold: 0B
      resolve-lazily: true
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

app:
  request-create:
    max-per-minute: ${REQUEST_CREATE_MAX_PER_MINUTE:5}
  auth:
    jwt-secret: ${JWT_SECRET}
    otp-hmac-secret: ${OTP_HMAC_SECRET}
    rate-limit-hmac-secret: ${RATE_LIMIT_HMAC_SECRET}
    issuer: drss
    access-token-ttl: 30m
    cookie-name: DRSS_ACCESS_TOKEN
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    otp-ttl: 5m
    otp-max-attempts: 5
    base-url: ${APP_BASE_URL}
    mail-from: ${MAIL_FROM}
  media:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    folder: ${CLOUDINARY_FOLDER:drss/local/dat}
    http-timeout-seconds: ${CLOUDINARY_HTTP_TIMEOUT_SECONDS:60}
    max-file-size: 10MB
    max-files-per-request: 5
    max-video-files-per-request: 1
    cleanup-enabled: ${MEDIA_CLEANUP_ENABLED:true}
    cleanup-fixed-delay: ${MEDIA_CLEANUP_FIXED_DELAY:PT5M}
    cleanup-batch-size: ${MEDIA_CLEANUP_BATCH_SIZE:25}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 64MB
  servlet:
    session:
      tracking-modes: cookie
