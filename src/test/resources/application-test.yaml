spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  mail:
    username: test-only@example.invalid
    password: test-only-mail-password

app:
  auth:
    jwt-secret: test-only-jwt-secret-at-least-32-bytes-aaaa
    otp-hmac-secret: test-only-otp-secret-at-least-32-bytes-bbbb
    base-url: http://localhost:8080
    mail-from: test-only@example.invalid
    rate-limit-hmac-secret: test-only-rate-limit-secret-at-least-32-cccc
  media:
    cloud-name: test-cloud
    api-key: test-api-key
    api-secret: test-api-secret
    folder: drss/test
    max-file-size: 10MB
    max-files-per-request: 5
    max-video-files-per-request: 1
